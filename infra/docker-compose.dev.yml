# Dev-only compose: Postgres + Redis + the FastAPI backend.
# Full production compose (adding Nginx, worker, frontend) lands in Milestone 16.
#
# Usage (from repo root):
#   docker compose -f infra/docker-compose.dev.yml up --build
#
# First run will apply migrations automatically (see backend/Dockerfile CMD).

services:
  postgres:
    image: pgvector/pgvector:pg16   # ships pgvector preinstalled — needed from Milestone 7 onward, harmless now
    container_name: ctf_insight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctf_user
      POSTGRES_PASSWORD: ctf_password
      POSTGRES_DB: ctf_insight_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf_user -d ctf_insight_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ctf_insight_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ctf_insight_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ctf_user:ctf_password@postgres:5432/ctf_insight_ai
      DATABASE_URL_SYNC: postgresql+psycopg2://ctf_user:ctf_password@postgres:5432/ctf_insight_ai
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

volumes:
  postgres_data:
  redis_data:
